services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: local-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    restart: always

volumes:
  minio_data:
